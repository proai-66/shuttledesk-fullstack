<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShuttleDesk — Internal Ticketing</title>
<link rel="icon" type="image/png" href="img/as.png" />

<!-- Tailwind (styling) + Supabase (auth/realtime) from CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: "class" };</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<!-- apply saved/OS theme before first paint, so there's no flash of the wrong theme -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var wantsDark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (wantsDark) document.documentElement.classList.add("dark");
    } catch (e) {}
  })();
</script>

<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; }
  /* Stop iOS Safari from auto-zooming when you tap an input (needs >=16px) */
  @media (max-width: 640px) {
    input, select, textarea { font-size: 16px !important; }
  }
  /* Smoother tap feedback on mobile */
  button { -webkit-tap-highlight-color: transparent; }

  /* ============================================================
     DARK MODE
     This app has no build step, so Tailwind's `dark:` variants
     aren't sprinkled through js/views.js — instead these rules
     reassign what the handful of slate/white utility classes used
     everywhere mean once <html> has class="dark". One place to
     tune the palette instead of hundreds of scattered dark: classes.
  ============================================================ */
  .dark { color-scheme: dark; }
  .dark .bg-slate-50  { background-color: #0f172a; }
  .dark .bg-white      { background-color: #1e293b; }
  .dark .bg-slate-100  { background-color: #334155; }
  .dark .bg-slate-200  { background-color: #475569; }

  .dark .text-slate-900 { color: #f1f5f9; }
  .dark .text-slate-800 { color: #e2e8f0; }
  .dark .text-slate-700 { color: #cbd5e1; }
  .dark .text-slate-600 { color: #94a3b8; }
  .dark .text-slate-500 { color: #94a3b8; }
  .dark .text-slate-400 { color: #64748b; }
  .dark .text-slate-300 { color: #475569; }

  .dark .border-slate-100 { border-color: #334155; }
  .dark .border-slate-200 { border-color: #334155; }
  .dark .border-slate-300 { border-color: #475569; }
  .dark .border-slate-400 { border-color: #64748b; }

  .dark .hover\:text-slate-700:hover  { color: #cbd5e1; }
  .dark .hover\:text-slate-900:hover  { color: #f1f5f9; }
  .dark .hover\:border-slate-300:hover { border-color: #475569; }
  .dark .hover\:border-slate-400:hover { border-color: #64748b; }
  .dark .hover\:bg-slate-200:hover    { background-color: #475569; }
  .dark .hover\:bg-slate-50:hover     { background-color: #334155; }
  .dark .hover\:bg-red-50:hover       { background-color: rgba(248,113,113,.15); }
  .dark .hover\:bg-red-100:hover      { background-color: rgba(248,113,113,.22); }

  .dark input, .dark select, .dark textarea {
    background-color: #1e293b; color: #e2e8f0; border-color: #334155;
  }
  .dark input::placeholder, .dark textarea::placeholder { color: #64748b; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- Everything renders into here -->
  <div id="app"><div class="min-h-screen flex items-center justify-center text-slate-400">Loading…</div></div>

  <!-- ============================================================
       JS MODULES — loaded in dependency order (top to bottom).
       Each file is one job. Edit the one you need, leave the rest.
  ============================================================ -->
  <script src="js/config.js"></script>     <!-- Supabase (auth/realtime) + backend API base URL + branches/categories -->
  <script src="js/i18n.js"></script>       <!-- translation strings + t() helper -->
  <script src="js/routing.js"></script>    <!-- client-side routing preview only (backend routes authoritatively) -->
  <script src="js/icons.js"></script>      <!-- inline SVG icons -->
  <script src="js/state.js"></script>      <!-- shared app state -->
  <script src="js/api.js"></script>        <!-- fetch() wrapper for the backend API -->
  <script src="js/data.js"></script>       <!-- load/read/write via the backend -->
  <script src="js/auth.js"></script>       <!-- login / logout / create account -->
  <script src="js/views.js"></script>      <!-- all the screens (HTML builders) -->
  <script src="js/events.js"></script>     <!-- clicks, typing, keyboard -->
  <script src="js/app.js"></script>        <!-- render() + startup -->

</body>
</html>
