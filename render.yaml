services:
  - type: web
    name: shuttledesk-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: 3001

staticSites:
  - name: shuttledesk-frontend
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
